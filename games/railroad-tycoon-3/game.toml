# GOG Railroad Tycoon 3 (RT3.exe, 2003, VC7-era C++). Behavioral reference is
# the hash-pinned executable below. Native host integration is bring-up work.
[game]
id = "railroad-tycoon-3"
name = "Railroad Tycoon 3"
app_name = "RailroadTycoon3Recomp"
bundle_id = "dev.recompkit.railroadtycoon3"
executable = "RT3.exe"
sha256 = "accb099b0d8ebac8b50c539a5cc91a863bc9ae399ae70da382ff1c22301e38a2"
image_base = 0x00400000
# The stock 0x01000000-0x0e000000 arena is 208 MB; RT3's large maps exhaust it.
# The 1 GB heap sits above the fixed runtime band, whose top is 0x10000000.
heap_base = 0x10000000
heap_end = 0x50000000
guest_size = 0x50000000
host_arena_base = 0
entry_point = 0x005a313b
guest_root = 'C:\Railroad Tycoon 3'
# Remove per-store checks; DirectDraw Unlock compares the whole locked surface.
store_hooks = false

[setup]
supported_version = "GOG 1.05"
source_notes = "Use the GOG copy with official patch 1.05 and no unofficial user patch. Disc editions are not verified."

[translate]
dispatch = { shift = 3, max_probe = 31 }
# The public map holds Ghidra boundaries and control-flow addresses. Translation
# decodes the original executable bytes; no instruction contents are published.
code_map = "metadata"
# Structural vtable-prefix bounds plus observed edges from typeinf.nominal.
indirect_targets = "metadata/indirect-targets.tsv"
private_leaf_contracts = true
checked_returns = [0x005a10d0]
state_contract_callers = [0x0042ce00, 0x0042c1b0]

[render]
d3d8_wgpu = true

[settings]
rows = ["window", "performance_overlay", "controls"]

[controls]
default_layout = "pad"
mobile_control = "mobile-only"
