# GOG SPORE Collection. Target the Galactic Adventures executable because GOG's
# primary play task launches it; base-game content stays in Data/.
[game]
id = "spore"
name = "Spore"
app_name = "SporeRecomp"
bundle_id = "dev.recompkit.spore"
executable = "SporeApp.exe"
sha256 = "99e5de9e5891421e518526080671844775198e0b6b125e8b71d54df821ce03c1"
image_base = 0x00400000
entry_point = 0x011e11e1
guest_size = 0x80000000
heap_base = 0x10000000
heap_end = 0x80000000
host_arena_base = 0
guest_root = 'C:\Program Files\Electronic Arts\SPORE\SporebinEP1'
windows_version = "5.1.2600"

[setup]
supported_version = "GOG Spore Collection — Galactic Adventures 3.1.0.22"
source_notes = "Choose the collection folder containing SporebinEP1, Data, DataEP1, and bp1content. The base game alone is not supported."

[translate]
code_map = "metadata"
native = { header = "native/video.h", sources = ["native/video.cpp"] }

[modules.aux.goggame]
name = "goggame-1948823323.dll"
original_path = "SporebinEP1/goggame-1948823323.dll"
sha256 = "06bed869d828c58c91a9b2b5edd92544e456cea7c8b684872c8598fd6ff20aab"
base = 0x10000000
size = 0x0003a000

[launcher]
install_names = ["SPORE Collection", "Spore"]
gog_ids = ["1948823323"]

[setup.layout]
executable_dir = "SporebinEP1"
data_root = "."
required_dirs = ["Data", "DataEP1", "bp1content"]

[controls]
default_layout = "hidden"
mobile_control = "mobile-only"

[registry.'HKEY_LOCAL_MACHINE\SOFTWARE\Electronic Arts\spore']
reindexyesorno = 0
installcompleted = 1
appdir = "Spore"
installloc = 'C:\Program Files\Electronic Arts\SPORE'
datadir = 'C:\Program Files\Electronic Arts\SPORE\Data'
playerdir = "My Spore Creations"
locale = "en-us"

[registry.'HKEY_LOCAL_MACHINE\SOFTWARE\Electronic Arts\spore_EP1']
AddOnID = 2
PackID = 128448390
DataDir = 'C:\Program Files\Electronic Arts\SPORE\DataEP1\'

[registry.'HKEY_LOCAL_MACHINE\SOFTWARE\Electronic Arts\spore Creepy and Cute Parts Pack']
AddOnID = 1
PackID = 116700625
DataDir = 'C:\Program Files\Electronic Arts\SPORE\bp1content\'
