[game]
id = "ghost-recon"
name = "Tom Clancy's Ghost Recon"
app_name = "GhostReconRecomp"
bundle_id = "dev.recompkit.ghostrecon"
executable = "GhostRecon.exe"
sha256 = "78786b4e95fa535bb364154885bc161a92e96dddac18b66716581a8725a9735f"
image_base = 0x00400000
host_arena_base = 0
entry_point = 0x006f3d14
guest_root = 'C:\Ghost Recon'
store_hooks = false

[setup]
supported_version = "GOG 1.4"
source_notes = "Use the GOG 1.4 game folder or the supported GOG 1.4.0.0 (19232) offline installer."

[[setup.installers]]
format = "inno"
label = "GOG 1.4.0.0 (19232)"
sha256 = "7338f5ea2a04dd1bf2e2a7a5a7b8022585a2eb0f8b38a2db8cc24bf41c19b9f9"
size = 528591248
expanded_size = 1034493539
move_files = { "__support/app/Data/Save/Script/default.ass" = "Data/Save/Script/default.ass" }

[translate]
code_map = "metadata"
analysis_facts = "metadata/analysis-facts.json"
# 006f4dc9 returns FUN_006f9414/FUN_006f9eb7 from the small-block heap or
# HeapAlloc(DAT_00946b80,...); its only direct caller is __nh_malloc 006f4d9d,
# which both _malloc 006f4d8b and operator_new 006f339f call.
allocators = [
    { function = 0x006f4dc9, evidence = "VC6 CRT small-block/heap allocator; sole direct caller __nh_malloc; HeapAlloc fallback" },
]
private_leaf_contracts = true
stack_memory = true
private_input_arguments = false
private_input_registers = { "00755990" = "ECX", "007b80e0" = "ECX", "0052f200" = "ECX", "00569150" = "ECX", "00538240" = "ECX" }
# MOV EAX,label; RET in Catch@ funclets hand these continuations to the C++ EH runtime.
alternate_entries = [
    0x0040201b,
    0x004110d8,
    0x0041a69d,
    0x0041a77d,
    0x0041a7db,
    0x0041a8bd,
    0x0041a90f,
    0x0041a9ed,
    0x0041aacd,
    0x0041abad,
    0x0041ac97,
    0x0041acf3,
    0x0041ad3f,
    0x00572ebf,
]
native = { header = "native/ghost_recon_native.h", sources = [
    "native/keyboard_labels.cpp",
    "native/projection_cull/projection_cull.c",
    "native/projection_cull/projection_build.c",
    "native/scene_post/scene_post.c",
    "native/port_tab/port_tab_logic.c",
    "native/port_tab/port_tab_rewrite.c",
    "native/port_tab/port_tab.c",
] }

[analysis]
method_catalog = "../../dx/metadata/com-methods.json"
effect_catalog = "../../dx/metadata/method-effects.json"
families = ["d3d8.dll!*::*"]
assert_effect_coverage = true
guest_bounds = true
assume_constant_vptr_stores = true
assume_compatible_cleanup = true
assume_balanced_returns = true
reuse_discovery_seeds = false

[render]
d3d8_wgpu = true

[input]
relative_mouse_capture = true
keyboard_names = "system"
mouse_sensitivity = 100
mouse_acceleration = false

[settings]
rows = ["window", "performance_overlay", "controls"]
window_mode = "windowed"
performance_overlay = "off"

[controls]
default_layout = "hidden"
mobile_control = "mobile-only"
