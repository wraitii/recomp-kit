[package]
name = "d3d8-wgpu"
version = "0.0.0"
edition = "2024"
publish = false
description = "Isolated D3D8-semantics renderer prototype on wgpu (not a game integration)"
license = "MIT OR Apache-2.0"

[lib]
name = "d3d8_wgpu"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "probe-headless"
path = "src/bin/probe_headless.rs"

[[bin]]
name = "probe-windowed"
path = "src/bin/probe_windowed.rs"

[[bin]]
name = "shader-corpus"
path = "src/bin/shader_corpus.rs"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
bcdec_rs = "0.2"
ddsfile = "0.5"
env_logger = "0.11"
half = { version = "2", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp", "pnm"] }
log = "0.4"
pollster = "0.4"
smallvec = { version = "1", features = ["union"] }
texpresso = "2"
wgpu = "27"
winit = "0.30"
naga = { version = "27", features = ["wgsl-in"] }

[build-dependencies]
cxx-build = "=1.0.171"

[dependencies.cxx]
version = "=1.0.171"

# The present handoff reads the raw MTLTexture behind wgpu's Metal backend;
# 0.32 is the version wgpu-hal 27 exposes through `raw_handle`.
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.32"
block = "0.1"
