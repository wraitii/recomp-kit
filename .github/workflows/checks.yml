name: Checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned contributor tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Test source tooling without game files
        run: .venv/bin/python -m unittest discover -s tools/recomp/tests -p 'test_*.py'
      - name: Check native code formatting
        run: .venv/bin/python tools/format.py
      - name: Check repository boundaries and documentation links
        run: .venv/bin/python tools/check_repo.py

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install parser generators
        run: brew install bison flex
      - name: Install CMake and Ninja
        run: |
          python3 -m venv .ci
          .ci/bin/python -m pip install cmake==4.1.2 ninja==1.13.0
          echo "$PWD/.ci/bin" >> "$GITHUB_PATH"
      - name: Configure without game files
        run: cmake --preset macos-stub
      - name: Build native test binaries and hosts
        run: cmake --build --preset macos-stub --target check_binaries recomp_app recomp_headless recomp_smoke
      - name: Run game-free native and GPU suites
        run: ctest --preset macos-stub -L 'nogame|gpu' --output-on-failure
