name: Desktop library

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, desktop-library-package]
    paths:
      - desktop/library/**
      - web/library/**
      - tools/**
      - cmake/**
      - dx/CMakeLists.txt
      - .github/workflows/library.yml

permissions:
  contents: read

concurrency:
  group: library-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore native dependency caches
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/library-dependencies
            build/library/rust
            ~/.cargo/registry
            ~/.cargo/git
          key: library-arm64-macos14-${{ hashFiles('cmake/Dependencies.cmake', 'dx/CMakeLists.txt', 'graphics/d3d8-wgpu/**', 'desktop/library/Cargo.lock', 'desktop/library/Cargo.toml', 'tools/build_d3d8_wgpu.py') }}-${{ github.sha }}
          restore-keys: |
            library-arm64-macos14-${{ hashFiles('cmake/Dependencies.cmake', 'dx/CMakeLists.txt', 'graphics/d3d8-wgpu/**', 'desktop/library/Cargo.lock', 'desktop/library/Cargo.toml', 'tools/build_d3d8_wgpu.py') }}-
      - name: Prepare pinned standalone Python
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/python.tar.gz" 'https://github.com/astral-sh/python-build-standalone/releases/download/20261013/cpython-3.14.8%2B20261013-aarch64-apple-darwin-install_only_stripped.tar.gz'
          echo "994adadc202c5df0b4570192cc9a70e3f2c131e512f4a125c56efa8562f44b28  $RUNNER_TEMP/python.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/standalone"
          tar -xzf "$RUNNER_TEMP/python.tar.gz" -C "$RUNNER_TEMP/standalone"
          "$RUNNER_TEMP/standalone/python/bin/python3" -m pip install cmake==4.1.2 ninja==1.13.0
          echo "$RUNNER_TEMP/standalone/python/bin" >> "$GITHUB_PATH"
      - name: Build portable application without game files
        run: >-
          "$RUNNER_TEMP/standalone/python/bin/python3" tools/build.py
          --target library --package-library
          --library-python-root "$RUNNER_TEMP/standalone/python"
          --build-root "$PWD/build"
      - name: Verify relocated build environment
        run: |
          mkdir -p "$RUNNER_TEMP/Relocated Library"
          ditto -x -k build/library/recomp-library-macos-arm64.zip "$RUNNER_TEMP/Relocated Library"
          resources="$RUNNER_TEMP/Relocated Library/Recomp Library.app/Contents/Resources"
          export PATH="$resources/python/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          "$resources/python/bin/python3" -c 'import capstone, pefile, numpy, pypcode, tomli'
          "$resources/python/bin/cmake" --version
          "$resources/python/bin/ninja" --version
          "$resources/python/bin/python3" "$resources/kit/tools/build.py" --game stub --stub --target app --build-root "$RUNNER_TEMP/relocated-build"
          codesign --verify --deep --strict "$RUNNER_TEMP/Relocated Library/Recomp Library.app"
      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: recomp-library-macos-arm64
          path: build/library/recomp-library-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Preserve build caches
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/library-dependencies
            build/library/rust
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cache.outputs.cache-primary-key }}
