name: Recomp Toolkit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: toolkit-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install parser generators
        run: brew install bison flex
      - name: Restore native dependency caches
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/toolkit-dependencies
            build/toolkit/rust
            build/toolkit/extractors
            build/toolkit/source-archives
            ~/.cargo/registry
            ~/.cargo/git
          key: toolkit-arm64-macos14-${{ hashFiles('cmake/Dependencies.cmake', 'dx/CMakeLists.txt', 'graphics/d3d8-wgpu/**', 'desktop/library/Cargo.lock', 'desktop/library/Cargo.toml', 'tools/build_d3d8_wgpu.py', 'tools/extractors/**', 'third_party/unshield/**') }}-${{ github.sha }}
          restore-keys: |
            toolkit-arm64-macos14-${{ hashFiles('cmake/Dependencies.cmake', 'dx/CMakeLists.txt', 'graphics/d3d8-wgpu/**', 'desktop/library/Cargo.lock', 'desktop/library/Cargo.toml', 'tools/build_d3d8_wgpu.py', 'tools/extractors/**', 'third_party/unshield/**') }}-
            toolkit-arm64-macos14-
      - name: Prepare pinned standalone Python
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/python.tar.gz" 'https://github.com/astral-sh/python-build-standalone/releases/download/20261013/cpython-3.14.8%2B20261013-aarch64-apple-darwin-install_only_stripped.tar.gz'
          echo "994adadc202c5df0b4570192cc9a70e3f2c131e512f4a125c56efa8562f44b28  $RUNNER_TEMP/python.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/standalone"
          tar -xzf "$RUNNER_TEMP/python.tar.gz" -C "$RUNNER_TEMP/standalone"
          "$RUNNER_TEMP/standalone/python/bin/python3" -m pip install cmake==4.1.2 ninja==1.13.0 -r tools/requirements-library.txt
          echo "$RUNNER_TEMP/standalone/python/bin" >> "$GITHUB_PATH"
      - name: Build portable application without game files
        run: >-
          "$RUNNER_TEMP/standalone/python/bin/python3" tools/build.py
          --target toolkit --package-toolkit
          --toolkit-python-root "$RUNNER_TEMP/standalone/python"
          --build-root "$PWD/build"
      - name: Verify relocated build environment
        run: |
          mkdir -p "$RUNNER_TEMP/Relocated Toolkit"
          ditto -x -k build/toolkit/recomp-toolkit-macos-arm64.zip "$RUNNER_TEMP/Relocated Toolkit"
          resources="$RUNNER_TEMP/Relocated Toolkit/Recomp Toolkit.app/Contents/Resources"
          export PATH="$resources/python/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          "$resources/python/bin/python3" -c 'import pefile, PIL, resvg_py'
          "$resources/dependencies/bin/recomp-translate" --help
          "$resources/python/bin/cmake" --version
          "$resources/python/bin/ninja" --version
          "$resources/python/bin/innoextract" --version
          "$resources/python/bin/python3" -c 'import sys; sys.path.insert(0, sys.argv[1]); import unshield_adapter; unshield_adapter.library()' "$resources/kit/tools"
          "$resources/python/bin/python3" "$resources/kit/tools/build.py" --game stub --stub --target app --build-root "$RUNNER_TEMP/relocated-build"
          codesign --verify --deep --strict "$RUNNER_TEMP/Relocated Toolkit/Recomp Toolkit.app"
      - name: Upload portable application
        if: ${{ !cancelled() && hashFiles('build/toolkit/recomp-toolkit-macos-arm64.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: recomp-toolkit-macos-arm64
          path: build/toolkit/recomp-toolkit-macos-arm64.zip
          if-no-files-found: error
          retention-days: 90
      - name: Preserve build caches
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            build/toolkit-dependencies
            build/toolkit/rust
            build/toolkit/extractors
            build/toolkit/source-archives
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cache.outputs.cache-primary-key }}
